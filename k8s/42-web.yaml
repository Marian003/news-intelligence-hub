# React SPA served by nginx. Purely static: the bundle is baked at image build
# time (including VITE_API_URL=/api), so these pods hold no state and can be
# scaled or replaced freely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: news-hub
  labels: {app: web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: news-hub/web:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 80}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
          # nginx needs to write its cache and pid, so the root filesystem stays
          # writable here; the tmpfs mounts below keep the writes off the image
          # layer. (The API and worker, which write nothing, run read-only.)
          volumeMounts:
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /var/run}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
              # nginx starts as root, chowns its cache dirs and then drops to
              # the `nginx` user itself - so it needs exactly these four back.
              # Dropping ALL without them fails at boot with
              # `chown("/var/cache/nginx/client_temp") failed`.
              # The alternative is the nginx-unprivileged image on :8080, which
              # would need a different port in nginx.conf and so diverge from
              # the docker-compose setup; keeping one image for both is worth
              # more here than removing four narrow capabilities.
              add: ['CHOWN', 'SETGID', 'SETUID', 'NET_BIND_SERVICE']
      volumes:
        - {name: cache, emptyDir: {}}
        - {name: run, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: news-hub
spec:
  selector: {app: web}
  ports:
    - {name: http, port: 80, targetPort: http}
