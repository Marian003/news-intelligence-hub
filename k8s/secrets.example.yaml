# TEMPLATE ONLY - contains no real values.
#
# The real Secret is generated from your git-ignored .env by
# `scripts/k8s-secret.sh`, which writes k8s/secret.yaml (also git-ignored).
# Never fill this file in and commit it.
#
# `stringData` takes plain text and lets Kubernetes do the base64 encoding, so
# the generator does not have to - and so a human can read it while debugging.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: news-hub
type: Opaque
stringData:
  # Required - the app refuses to start without these (see env.validation.ts).
  POSTGRES_PASSWORD: 'replace-me'
  JWT_SECRET: 'replace-me-at-least-16-characters'
  BULLBOARD_PASSWORD: 'replace-me'
  # Optional at boot; the active adapter fails loudly only when actually called.
  ANTHROPIC_API_KEY: ''
  OPENAI_API_KEY: ''
