# PostgreSQL: the system of record (users, feeds, articles, entities, digests).
#
# A Deployment + PVC rather than a StatefulSet, because there is exactly one
# replica and no need for stable per-pod identity or ordered rollout. The PVC is
# what actually preserves the data across pod restarts; `strategy: Recreate`
# stops a rolling update from ever running two postgres pods against the same
# ReadWriteOnce volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: news-hub
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: news-hub
  labels: {app: postgres}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: app-config, key: POSTGRES_DB}}
            - name: POSTGRES_USER
              valueFrom: {configMapKeyRef: {name: app-config, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: app-secrets, key: POSTGRES_PASSWORD}}
            # The image initialises the cluster in this directory. Pointing it at
            # a subdirectory of the mount avoids initdb tripping over the
            # `lost+found` that some volume types create at the mount root.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
          readinessProbe:
            exec:
              command: ['sh', '-c', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ['sh', '-c', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: news-hub
spec:
  selector: {app: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
