# Whole-stack orchestration. Reads configuration from `.env` (copy it from
# `.env.example`). Services are added as their milestones land; so far:
# postgres, redis, and the backend with a dependency-aware healthcheck.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_HOST_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_HOST_PORT}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies SQL migrations, then exits. The backend waits for it to
  # finish so the API never serves against an un-migrated database. It reuses the
  # backend image (built by the backend service) rather than building its own.
  migrate:
    image: news-intelligence-hub-backend
    command: ['node', 'packages/backend/dist/database/migrate.js']
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    image: news-intelligence-hub-backend
    env_file:
      - .env
    ports:
      - '${BACKEND_PORT}:${BACKEND_PORT}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Background processing (feed polling, later article processing). Same image as
  # the backend, different entrypoint — no HTTP server. Scaling this service does
  # not touch the API.
  worker:
    image: news-intelligence-hub-backend
    command: ['node', 'packages/backend/dist/worker.js']
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Queue dashboard, standalone (not mounted in the API) and basic-auth protected.
  bullboard:
    image: news-intelligence-hub-backend
    command: ['node', 'packages/backend/dist/bullboard.js']
    env_file:
      - .env
    ports:
      - '${BULLBOARD_PORT}:${BULLBOARD_PORT}'
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:'+process.env.BACKEND_PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
